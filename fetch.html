<!DOCTYPE html>
<html>
<head>
    <title>Coursework Fetch</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
</head>
<body>
<div id="app">
    <h1>Fetch Test</h1>

    <input type="text" v-model="searchWord" placeholder="Search lessons..." @input="applySearch" />

    <div v-for="lesson in lessons" :key="lesson._id" style="border:1px solid #ccc; margin:5px; padding:5px;">
        <h3>{{ lesson.title }}</h3>
        <p>Location: {{ lesson.location }}</p>
        <p>Price: {{ lesson.price }}</p>
        <p>Spaces: {{ lesson.availableInventory }}</p>
        <button @click="addToCart(lesson)" :disabled="lesson.availableInventory <= 0">Add to Cart</button>
    </div>

    <h2>Cart</h2>
    <div v-for="(item, index) in cart" :key="index" style="border:1px solid #999; margin:5px; padding:5px;">
        <p>{{ item.title }} - {{ item.price }}</p>
        <button @click="removeFromCart(index)">Remove</button>
    </div>

    <h2>Customer Details</h2>
    <p><label>First Name:</label> <input type="text" v-model="customer.firstname"></p>
    <p><label>Last Name:</label> <input type="text" v-model="customer.lastname"></p>
    <p><label>Email:</label> <input type="text" v-model="customer.email"></p>
    <button @click="placeOrder" :disabled="!cart.length || !customer.firstname || !customer.lastname || !customer.email">Place Order</button>
</div>

<script>
const API = "https://coursework-backend-47ve.onrender.com";

new Vue({
    el: "#app",
    data: {
        lessons: [],
        searchWord: "",
        cart: [],
        customer: { firstname: '', lastname: '', email: '' }
    },
    methods: {
        loadLessons() {
            fetch(API + "/lessons")
                .then(res => res.json())
                .then(data => this.lessons = data)
                .catch(err => console.error(err));
        },
        applySearch() {
            if (!this.searchWord) return this.loadLessons();
            fetch(API + "/search?keyword=" + encodeURIComponent(this.searchWord))
                .then(res => res.json())
                .then(data => this.lessons = data)
                .catch(err => console.error(err));
        },
        addToCart(lesson) {
            this.cart.push(lesson);
        },
        removeFromCart(index) {
            this.cart.splice(index, 1);
        },
        async placeOrder() {
            const order = {
                customer: { ...this.customer },
                items: this.cart.map(i => ({ ...i })),
                total: this.cart.reduce((sum, i) => sum + Number(i.price), 0),
                date: new Date().toLocaleString()
            };
            try {
                const res = await fetch(API + "/orders", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(order)
                });
                const data = await res.json();
                alert("Order placed successfully!");
                this.cart = [];
                this.customer.firstname = '';
                this.customer.lastname = '';
                this.customer.email = '';
                this.loadLessons();
            } catch (err) {
                console.error(err);
            }
        }
    },
    created() {
        this.loadLessons();
    }
});
</script>
</body>
</html>
