<!DOCTYPE html>
<html>
<head>
    <title>After School Lessons</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header>
        <h1>{{ sitename }}</h1>
        <button v-on:click="showCheckout" v-if="cartItemCount > 0">
            {{cartItemCount}} <i class="fa-solid fa-cart-shopping"></i> Check out
        </button>
        <button disabled v-else><i class="fa-solid fa-cart-shopping"></i> Check out</button>
        <div class="search-wrap">
            <input type="text" v-model.trim="searchTerm" placeholder="Search lessons, location, or description..." @input="searchLessons"/>
            <button v-if="searchTerm" v-on:click="clearSearch">✕</button>
        </div>
    </header>

    <!-- SORT CONTROLS -->
    <div v-if="showproduct" class="sort-controls">
        <select v-model="sortKey">
            <option value="">Sort by...</option>
            <option value="title">Title</option>
            <option value="location">Location</option>
            <option value="price">Price</option>
            <option value="availableInventory">Spaces</option>
        </select>
        <button v-on:click="toggleSortOrder">
            {{ sortOrder === 'asc' ? 'Ascending' : 'Descending' }}
        </button>
    </div>

    <main>
        <!-- LESSONS PAGE -->
        <div v-if="showproduct">
            <div v-for="Product in sortedProducts" :key="Product.id" class="lesson-box">
                <figure>
                    <img :src="Product.image" :alt="Product.title"/>
                </figure>
                <h3>{{ Product.title }}</h3>
                <p>{{ Product.description }}</p>
                <p><strong>Price:</strong> {{ Product.price }}</p>
                <p><strong>Spaces:</strong> {{ Product.availableInventory - cartCount(Product) }}</p>
                <p><strong>Location:</strong> {{ Product.location }}</p>
                <button v-on:click="addToCart(Product)" :disabled="!canAddToCart(Product)">Add to cart</button>
                <div>
                    <span v-for="n in Product.rating">★</span>
                    <span v-for="n in 5 - Product.rating">☆</span>
                </div>
            </div>
        </div>

        <!-- CART & CHECKOUT PAGE -->
        <div v-else>
            <h2>Shopping Cart</h2>
            <div v-for="(item, index) in cart" :key="index" class="lesson-box">
                <h3>{{ item.title }}</h3>
                <p><strong>Price:</strong> {{ item.price }}</p>
                <p><strong>Location:</strong> {{ item.location }}</p>
                <button v-on:click="removeFromCart(index)">Remove</button>
            </div>

            <h2>Checkout</h2>
            <p>
                <label>First Name:</label>
                <input type="text" v-model.trim="order.firstname"/>
            </p>
            <p>
                <label>Last Name:</label>
                <input type="text" v-model.trim="order.lastname"/>
            </p>
            <p>
                <label>Address:</label>
                <input type="text" v-model="order.address"/>
            </p>
            <p>
                <label>City:</label>
                <input type="text" v-model="order.city"/>
            </p>
            <p>
                <label>State:</label>
                <select v-model="order.state">
                    <option disabled value="">Select state</option>
                    <option v-for="(state, key) in states" :value="state">{{ key }}</option>
                </select>
            </p>
            <p>
                <label>Zip Code:</label>
                <input type="number" v-model.number="order.zip"/>
            </p>
            <p>
                <input type="checkbox" id="gift" v-model="order.gift" :true-value="order.sendGift" :false-value="order.dontsendGifts"/>
                <label for="gift">Ship as gift?</label>
            </p>
            <p>
                <input type="radio" id="home" value="home" v-model="order.method"/>
                <label for="home">Home</label>
                <input type="radio" id="business" value="business" v-model="order.method"/>
                <label for="business">Business</label>
            </p>

            <button v-on:click="submitForm" :disabled="!validOrder">Place Order</button>
        </div>
    </main>
</div>

<script>
const API = "http://localhost:3000";

new Vue({
    el: '#app',
    data: {
        sitename: "After School Lessons",
        products: [],
        searchTerm: '',
        showproduct: true,
        cart: [],
        order: {
            firstname: '',
            lastname: '',
            address: '',
            city: '',
            zip: '',
            state: '',
            method: 'home',
            gift: 'do not send as Gifts',
            sendGift: 'Send as gift',
            dontsendGifts: 'Do not send as gift',
        },
        states: {AL: 'Alabama', AR: 'Arizona', CA: 'California', NV: 'Nevada'},
        sortKey: '',
        sortOrder: 'asc'
    },
    methods: {
        loadLessons() {
            fetch(API + "/lessons")
                .then(r => r.json())
                .then(data => this.products = data)
                .catch(err => console.error(err));
        },

        addToCart(product) {
            this.cart.push(product);
        },

        removeFromCart(index) {
            this.cart.splice(index, 1);
            if (this.cart.length === 0) this.showproduct = true;
        },

        cartCount(product) {
            return this.cart.filter(item => item === product).length;
        },

        canAddToCart(product) {
            return product.availableInventory > this.cartCount(product);
        },

        showCheckout() {
            this.showproduct = !this.showproduct;
        },

        searchLessons() {
            const term = this.searchTerm.trim().toLowerCase();
            if (!term) {
                this.loadLessons();
                return;
            }
            fetch(API + "/search?keyword=" + encodeURIComponent(term))
                .then(r => r.json())
                .then(data => this.products = data)
                .catch(err => console.error(err));
        },

        clearSearch() {
            this.searchTerm = '';
            this.loadLessons();
        },

        submitForm() {
            alert("Order submitted successfully!");
            this.cart = [];
            this.showproduct = true;
            this.order.firstname = '';
            this.order.lastname = '';
            this.order.address = '';
            this.order.city = '';
            this.order.zip = '';
            this.order.state = '';
            this.order.method = 'home';
            this.order.gift = 'do not send as Gifts';
        },

        toggleSortOrder() {
            this.sortOrder = this.sortOrder === 'asc' ? 'desc' : 'asc';
        }
    },
    computed: {
        cartItemCount() { return this.cart.length; },

        validOrder() {
            const nameRegex = /^[A-Za-z]+$/;
            const phoneRegex = /^[0-9]+$/;
            return this.order.firstname && this.order.lastname && this.order.address &&
                this.order.city && this.order.zip && this.order.state &&
                nameRegex.test(this.order.firstname) && nameRegex.test(this.order.lastname) &&
                phoneRegex.test(String(this.order.zip));
        },

        sortedProducts() {
            if (!this.sortKey) return this.products;

            return this.products.slice().sort((a, b) => {
                let valA = a[this.sortKey];
                let valB = b[this.sortKey];

                if (typeof valA === "string") valA = valA.toLowerCase();
                if (typeof valB === "string") valB = valB.toLowerCase();

                if (valA < valB) return this.sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return this.sortOrder === 'asc' ? 1 : -1;
                return 0;
            });
        }
    },
    created() {
        this.loadLessons();
    }
});
</script>
</body>
</html>
